    <style>
        :root {

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            overscroll-behavior-y: none;
            background-color: #111111;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        @media (min-width: 769px) {

        body {
            background-color: #111111;
            color: #F8F8F8;
            font-family: 'DM Sans', sans-serif;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            overflow-x: hidden;
            overflow-x: clip;
            max-width: 100vw;
        }
        body.intro-locked {
            overflow: hidden;
            height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04; z-index: 9998; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            transform: translateZ(0);
        }

        /* =========================================================
           INTRO CINEMATOGRÁFICA (FAÍSCAS + HUD + CORTE A LASER + CORTINA)
           ========================================================= */
        #intro-stage {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 10000;
            overflow: hidden;
            pointer-events: all;
        }
        #intro-stage.phase-open {
            pointer-events: none;
        }

        .intro-curtain {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50.5%;
            background: #0B0B0B;
            z-index: 1;
            will-change: transform;
            transition: transform 0.95s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .intro-curtain-top {
            top: 0;
            border-bottom: 1px solid rgba(255, 184, 0, 0.14);
        }
        .intro-curtain-bottom {
            bottom: 0;
            border-top: 1px solid rgba(255, 184, 0, 0.14);
        }
        #intro-stage.phase-open .intro-curtain-top {
            transform: translate3d(0, -102%, 0);
        }
        #intro-stage.phase-open .intro-curtain-bottom {
            transform: translate3d(0, 102%, 0);
        }

        .intro-grid {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 2;
            background-image:
                linear-gradient(rgba(255, 184, 0, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 184, 0, 0.035) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,0.9) 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.9) 0%, transparent 78%);
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .intro-ambient {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 2;
            background: radial-gradient(circle at 50% 52%, rgba(255, 184, 0, 0.12) 0%, rgba(255, 184, 0, 0.02) 34%, transparent 65%);
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .intro-scanline {
            position: absolute;
            left: 0;
            top: -12%;
            width: 100%;
            height: 2px;
            z-index: 3;
            background: linear-gradient(90deg, transparent, rgba(255, 184, 0, 0.55), transparent);
            box-shadow: 0 0 22px rgba(255, 184, 0, 0.45);
            animation: intro-scan 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        @keyframes intro-scan {
            0% { top: -5%; opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { top: 105%; opacity: 0; }
        }

        #intro-sparks {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .intro-flash-line {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            z-index: 8;
            background: linear-gradient(90deg, transparent 0%, #FFB800 20%, #FFF3C4 50%, #FFB800 80%, transparent 100%);
            box-shadow: 0 0 24px #FFB800, 0 0 60px rgba(255, 184, 0, 0.75);
            transform: translateY(-50%) scaleX(0);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }
        #intro-stage.phase-flash .intro-flash-line {
            transform: translateY(-50%) scaleX(1);
            opacity: 1;
        }
        #intro-stage.phase-open .intro-flash-line {
            opacity: 0;
        }

        .intro-hud {
            position: relative;
            z-index: 6;
            height: 100%;
            width: 100%;
            padding: 32px 6%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #intro-stage.phase-flash .intro-hud,
        #intro-stage.phase-open .intro-hud {
            opacity: 0;
            transform: scale(0.96);
        }
        #intro-stage.phase-flash .intro-grid,
        #intro-stage.phase-flash .intro-scanline,
        #intro-stage.phase-flash .intro-ambient,
        #intro-stage.phase-open .intro-grid,
        #intro-stage.phase-open .intro-scanline,
        #intro-stage.phase-open .intro-ambient,
        #intro-stage.phase-open #intro-sparks {
            opacity: 0;
        }

        .intro-hud-top,
        .intro-hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .intro-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.48);
            font-weight: 500;
        }
        .intro-chip strong {
            color: #FFB800;
            font-weight: 600;
        }
        .intro-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #FFB800;
            box-shadow: 0 0 12px #FFB800;
            animation: intro-pulse-anim 1.4s ease-in-out infinite;
        }
        @keyframes intro-pulse-anim {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.45; }
        }

        .intro-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        .intro-eyebrow {
            font-size: 10px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #FFB800;
            margin-bottom: 16px;
            min-height: 16px;
            font-weight: 600;
        }

        .intro-brand-mask {
            overflow: hidden;
            padding: 4px 0;
        }
        .intro-brand {
            font-family: 'Anton', sans-serif;
            font-size: clamp(40px, 8.5vw, 108px);
            letter-spacing: 0.08em;
            line-height: 1;
            color: #F8F8F8;
            transform: translate3d(0, 115%, 0);
            animation: intro-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }
        .intro-brand span {
            background: linear-gradient(110deg, #FFB800 18%, #FFF2B2 48%, #CC9200 78%);
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: intro-shimmer 2.4s linear infinite;
        }
        @keyframes intro-rise {
            to { transform: translate3d(0, 0, 0); }
        }
        @keyframes intro-shimmer {
            to { background-position: 220% center; }
        }

        .intro-counter-wrap {
            margin-top: 22px;
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-family: 'Anton', sans-serif;
            line-height: 1;
        }
        #intro-pct {
            font-size: clamp(34px, 5vw, 54px);
            letter-spacing: 0.06em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.65);
        }
        .intro-pct-sign {
            font-size: 18px;
            color: #FFB800;
            letter-spacing: 0.08em;
        }

        .intro-progress-wrap {
            width: min(380px, 82vw);
            margin-top: 18px;
        }
        .intro-bar-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.09);
            position: relative;
            overflow: visible;
            border-radius: 2px;
        }
        #intro-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #CC9200, #FFB800, #FFF0B3);
            box-shadow: 0 0 16px rgba(255, 184, 0, 0.85);
            border-radius: 2px;
        }
        #intro-bar-fill::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FFF6CC;
            box-shadow: 0 0 12px #FFB800, 0 0 22px #FFB800;
        }
        .intro-ticks {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 9px;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.3);
        }

        .intro-skip {
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.65);
            padding: 8px 16px;
            border-radius: 100px;
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }
        .intro-skip:hover {
            border-color: #FFB800;
            color: #FFB800;
            background: rgba(255, 184, 0, 0.08);
        }

        /* Entrada cinematográfica do Hero e Navbar ao abrir a cortina */
        .hero-canvas-stage {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 1;
            transform: scale(1.12);
            filter: brightness(0.55);
            transition: transform 1.45s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s ease;
            will-change: transform, filter;
        }
        body.site-ready .hero-canvas-stage {
            transform: scale(1);
            filter: none;
        }

        #hero-lcp-poster {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
            background-color: #111111;
        }

        #hero-canvas {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background-color: transparent;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 2;
        }
        #hero-canvas.ready {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(180deg, rgba(17,17,17,0.38) 0%, transparent 28%, transparent 72%, rgba(17,17,17,0.52) 100%);
            z-index: 10;
            pointer-events: none;
        }

        nav {
            position: fixed; top: 0; width: 100%; z-index: 50; padding: 20px 24px;
            opacity: 0; transform: translate3d(0, -28px, 0);
            transition: padding 0.4s ease, opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s;
        }
        body.site-ready nav {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 0.5px solid rgba(255,255,255,0.08); padding: 14px 28px; border-radius: 100px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        nav.scrolled .nav-inner { background-color: rgba(17,17,17,0.88); border-color: rgba(255,255,255,0.12); }
        .nav-logo { font-family: 'Anton', sans-serif; letter-spacing: 0.15em; font-size: 15px; color: rgba(255,255,255,0.9); text-decoration: none; }
        .nav-logo span { color: #FFB800; }
        .nav-links { display: flex; gap: 32px; align-items: center; }
        .nav-links a { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: rgba(255,255,255,0.9); }
        .nav-cta { background-color: rgba(255,184,0,0.15); border: 0.5px solid rgba(255,184,0,0.35); color: #FFB800 !important; padding: 8px 20px; border-radius: 100px; transition: background-color 0.2s ease, border-color 0.2s ease !important; }
        .nav-cta:hover { background-color: rgba(255,184,0,0.25) !important; border-color: rgba(255,184,0,0.6) !important; color: #FFB800 !important; }
        .nav-icons { display: flex; gap: 16px; color: rgba(255,255,255,0.6); }

        /* Calibrado para 110 frames (0083.webp a 0192.webp) */
        #scroll-hero { height: 600vh; position: relative; background-color: #111111; }

        .hero-sticky {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100svh;
            width: 100%;
            overflow: hidden;
            background-color: #111111;
            background-size: cover;
            background-position: center;
        }

        .scroll-dots {
            position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 60;
            display: flex; flex-direction: column; gap: 24px; pointer-events: none;
            opacity: 0; transition: opacity 0.8s ease 0.5s;
        }
        body.site-ready .scroll-dots { opacity: 1; }
        .dot { width: 4px; height: 4px; background-color: #fff; border-radius: 50%; opacity: 0.15; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease; will-change: transform, opacity; }
        .dot.active { opacity: 1; transform: scale(2.5); background-color: var(--brand-yellow); box-shadow: 0 0 15px var(--brand-yellow); }

        .scroll-indicator { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 30; opacity: 0; transition: opacity 0.6s ease 0.55s; pointer-events: none; }
